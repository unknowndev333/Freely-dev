name: FREELY PS4 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download temporary sample icon
        run: |
          mkdir -p freely/sce_sys
          curl -fL https://raw.githubusercontent.com/OpenOrbis/OpenOrbis-PS4-Toolchain/master/samples/hello_world/sce_sys/icon0.png -o freely/sce_sys/icon0.png

      - name: Inspect OpenOrbis tool paths
        run: |
          docker run --rm --user root openorbisofficial/toolchain:v0.5.1 bash -lc 'echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"; ls -la "$OO_PS4_TOOLCHAIN/bin/linux"; find "$OO_PS4_TOOLCHAIN" -maxdepth 4 -type f \( -name "*fself*" -o -name "*eboot*" -o -name "PkgTool.Core" -o -name "create-gp4" \) -print'

      - name: Build with official OpenOrbis container
        run: |
          docker run --rm --user root \
            -w /workspace/freely \
            -v "${{ github.workspace }}:/workspace" \
            openorbisofficial/toolchain:v0.5.1 make

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: FREELY-PS4-build
          path: |
            freely/IV0000-FREY00001_00-FREELYDEV0000001.pkg
            freely/eboot.bin
          if-no-files-found: error
          retention-days: 14
