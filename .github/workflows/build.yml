name: Freely Dev PS4 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate Freely Dev bird icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check Pillow
          mkdir -p freely/sce_sys
          .venv/bin/python freely/tools/make_icon.py freely/sce_sys/icon0.png
          file freely/sce_sys/icon0.png

      - name: Download create-gp4
        run: |
          mkdir -p .ci/create-gp4
          curl -fL https://github.com/OpenOrbis/create-gp4/releases/download/v1.0/binaries.tar.gz -o .ci/create-gp4/binaries.tar.gz
          tar -xzf .ci/create-gp4/binaries.tar.gz -C .ci/create-gp4

      - name: Download create-fself
        run: |
          mkdir -p .ci/create-fself
          curl -fL https://github.com/OpenOrbis/create-fself/releases/download/v1.3/binaries.tar.gz -o .ci/create-fself/binaries.tar.gz
          tar -xzf .ci/create-fself/binaries.tar.gz -C .ci/create-fself
          chmod +x .ci/create-fself/bin/linux/create-fself

      - name: Build and validate PS4 PKG
        run: |
          docker run --rm --user root \
            -w /workspace/freely \
            -v "${{ github.workspace }}:/workspace" \
            openorbisofficial/toolchain:latest bash -lc '
              cp /workspace/.ci/create-gp4/bin/linux/create-gp4 "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
              cp /workspace/.ci/create-fself/bin/linux/create-fself "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
              chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4" "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
              make clean
              make
              test -s "eboot.bin"
              test -s "sce_sys/param.sfo"
              test -s "sce_sys/icon0.png"
              test -s "IV0000-FREY00001_00-FREELYDEV0000001.pkg"
            '

      - name: Upload Freely Dev package
        uses: actions/upload-artifact@v4
        with:
          name: Freely-Dev-PS4-PKG
          path: |
            freely/IV0000-FREY00001_00-FREELYDEV0000001.pkg
            freely/eboot.bin
            freely/sce_sys/icon0.png
          if-no-files-found: error
          retention-days: 14
